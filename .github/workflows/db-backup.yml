name: Pre-release DB backup

# Before a release that carries migrations: back up the PRODUCTION database
# (schema `public`), encrypt it, and PROVE it restores — fail-closed.
#
#   backup  scripts/backup-db.sh      pg_dump -Fc + manifest in one snapshot,
#                                     gpg AES-256, sha256 next to the file
#   verify  scripts/verify-db-backup.sh  checksum → decrypt → restore into a
#                                     throwaway network-less postgres:<major> →
#                                     manifest diff (rows+content, RLS, owners,
#                                     policies, GRANTs, migrations) → synthetic test
#   upload  only a VERIFIED backup is kept (artifact, 14 days)
#
# The pipeline itself is tested on fake data by db-backup-selftest.yml.
# Any failure fails the job. Make "Encrypted production DB backup" a REQUIRED
# check on `main` and `develop` (branch protection) so a release cannot be
# merged without a verified backup.
#
# Secrets (Settings → Secrets and variables → Actions), nothing else is used:
#   PROD_DATABASE_URL  Supabase SESSION pooler URL (…pooler.supabase.com:5432,
#                      user `postgres`): runners have no IPv6 for db.*.supabase.co.
#   BACKUP_PASSPHRASE  long random passphrase, also kept outside GitHub.
# Values derived from the URL (URL without query, password, host) are masked too.
# The dump holds personal data (GDPR): it only leaves the runner encrypted.

on:
  pull_request:
    branches: [main, develop]
    paths: ["prisma/migrations/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: Encrypted production DB backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: db-backup
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and mask secrets
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Set the PROD_DATABASE_URL and BACKUP_PASSPHRASE repository secrets: no backup, no release."
            exit 1
          fi
          # GitHub masks the secret itself, not values derived from it.
          echo "::add-mask::${PROD_DATABASE_URL%%\?*}"
          python3 - <<'PY'
          import os, urllib.parse as u
          parts = u.urlsplit(os.environ["PROD_DATABASE_URL"])
          for value in {parts.password, u.unquote(parts.password or ""), parts.hostname, parts.username and parts.password and f"{parts.username}:{parts.password}"}:
              if value:
                  print(f"::add-mask::{value}")
          PY

      # Client at the server's major version (pg_dump refuses newer servers, and
      # the custom-format archive must be readable by the verify server).
      - name: Install a PostgreSQL client matching the server
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq postgresql-common >/dev/null
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          major="$(psql "${DATABASE_URL%%\?*}" -X -A -t -c "select current_setting('server_version_num')::int / 10000" 2>&1 | sed -E 's#postgres(ql)?://[^ ]+#postgresql://***#g')"
          [[ "$major" =~ ^[0-9]+$ ]] || { echo "::error::Could not read the server version: $major"; exit 1; }
          sudo apt-get install -y -qq "postgresql-client-${major}" >/dev/null
          echo "PG_BIN_DIR=/usr/lib/postgresql/${major}/bin" >> "$GITHUB_ENV"
          echo "PG_IMAGE=postgres:${major}" >> "$GITHUB_ENV"

      - name: Back up (pg_dump -Fc + manifest, encrypted, sha256)
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: bash scripts/backup-db.sh pre-release

      - name: Verify (checksum, decrypt, restore, manifest, synthetic test)
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(backups/pre-release-*.backup.tar.gpg)
          [ "${#files[@]}" -eq 1 ] || { echo "::error::Expected exactly one backup, found ${#files[@]}"; exit 1; }
          bash scripts/verify-db-backup.sh "${files[0]}"

      - name: Upload the verified backup
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: |
            backups/pre-release-*.backup.tar.gpg
            backups/pre-release-*.backup.tar.gpg.sha256
          if-no-files-found: error
          retention-days: 14
